<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PERMAI TASK LIST</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#172b4d; --muted:#6b778c; --line:#e4e8ee; --rail:#fbfcfd; --orb:#6a9bff; }
  #orb {
    position:fixed; top:0; left:0; width:1104px; height:1104px; margin:-552px 0 0 -552px;
    border-radius:50%; pointer-events:none; z-index:0; opacity:.3;
    background:radial-gradient(circle, var(--orb) 0%, transparent 70%);
    filter:blur(120px); will-change:transform; transition:opacity .3s;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }

  /* ---- app shell ---- */
  .app {
    display:grid; height:100vh; position:relative; z-index:1;
    grid-template-columns:240px 1fr 300px;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"header header header" "left main right" "footer footer footer";
  }

  .topbar {
    grid-area:header; display:flex; align-items:center; gap:16px;
    padding:12px 22px; background:var(--card); border-bottom:1px solid var(--line);
  }
  .brand { font-size:23px; font-weight:800; letter-spacing:.3px; white-space:nowrap; }
  .today { color:var(--muted); font-size:14px; white-space:nowrap; }
  .hspacer { flex:1; }
  .search-wrap { position:relative; }
  .search-wrap::before { content:"🔍"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.6; }
  #search {
    border:1.5px solid var(--line); border-radius:10px; padding:9px 13px 9px 32px;
    font-size:15px; background:var(--bg); color:var(--ink); outline:none; width:240px; transition:border-color .15s;
  }
  #search:focus { border-color:#4c9aff; }
  .hctrl { display:flex; align-items:center; gap:8px; }
  .whoami { border:1.5px solid var(--line); border-radius:9px; padding:8px 9px; font-size:13px; background:var(--bg); color:var(--ink); cursor:pointer; max-width:130px; }
  .iconbtn { border:1.5px solid var(--line); background:var(--bg); border-radius:9px; width:38px; height:38px; font-size:16px; cursor:pointer; color:var(--ink); }
  .iconbtn:hover { border-color:#4c9aff; }

  /* ---- rails ---- */
  .left  { grid-area:left;  background:var(--rail); border-right:1px solid var(--line); overflow-y:auto; padding:16px 14px; }
  .right { grid-area:right; background:var(--rail); border-left:1px solid var(--line);  overflow-y:auto; padding:16px 16px; }
  .rail-sec { margin-bottom:22px; }
  .rail-h { font-size:12px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .rail-h-row { display:flex; align-items:center; justify-content:space-between; }
  .managebtn { border:none; background:none; color:#9aa6b2; font-size:12px; font-weight:700; cursor:pointer; text-transform:none; letter-spacing:0; }
  .managebtn:hover { color:#0c66e4; }

  .nav { display:flex; flex-direction:column; gap:4px; margin-bottom:22px; }
  .navbtn {
    text-align:left; border:none; background:none; border-radius:9px; padding:10px 12px;
    font-size:16px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .12s;
  }
  .navbtn:hover { background:rgba(127,140,160,.14); }
  .navbtn.active { background:#e6efff; color:#0c66e4; }

  .member {
    display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px;
    cursor:pointer; transition:background .12s; margin-bottom:2px;
  }
  .member:hover { background:rgba(127,140,160,.14); }
  .member.sel { background:#e6efff; }
  .m-dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .m-name { flex:1; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .m-count { font-size:13px; font-weight:700; color:var(--muted); }
  .m-edit { border:none; background:none; color:#aab4c0; font-size:14px; cursor:pointer; padding:2px 4px; opacity:0; transition:opacity .12s,color .12s; }
  .member:hover .m-edit { opacity:1; }
  .m-edit:hover { color:#0c66e4; }
  .addperson {
    width:100%; margin-top:8px; border:1.5px dashed var(--line); background:none; border-radius:9px;
    padding:9px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; transition:all .12s;
  }
  .addperson:hover { border-color:#4c9aff; color:#0c66e4; }

  .prifilter, .labelfilter { display:flex; flex-wrap:wrap; gap:6px; }
  .prifilter button {
    border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px;
    font-size:13px; font-weight:700; color:#7d8a98; cursor:pointer;
  }
  .prifilter button.active { border-color:#0c66e4; color:#0c66e4; background:#e6efff; }
  .efftoggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; border:1.5px solid var(--line); background:var(--card); border-radius:9px; padding:9px 12px; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; }
  .efftoggle .eff-state { font-size:12px; font-weight:800; padding:2px 9px; border-radius:12px; background:#e6efff; color:#0c66e4; }
  .efftoggle.off .eff-state { background:rgba(127,140,160,.2); color:var(--muted); }
  .lchip {
    display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card);
    border-radius:14px; padding:4px 10px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer;
  }
  .lchip .ldot { width:10px; height:10px; border-radius:50%; }
  .lchip.active { border-color:#0c66e4; background:#e6efff; }

  /* ---- main board ---- */
  .main { grid-area:main; overflow:auto; padding:18px; }
  .board { display:flex; gap:14px; align-items:flex-start; min-height:100%; }
  @media (max-width:900px) {
    .app { grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto auto;
           grid-template-areas:"header" "left" "main" "right" "footer"; }
    .board { flex-direction:column; }
    .col { width:100%; min-width:0; max-height:none; }
    .tasks { overflow-y:visible; }
    .right { max-height:240px; }
    #search { width:150px; }
  }

  .col {
    width:300px; min-width:300px; max-height:100%;
    background:#ebecf0; border-radius:13px; display:flex; flex-direction:column;
    border-top:4px solid var(--c); transition:opacity .15s;
  }
  .col.dim { opacity:.35; }
  .col-head { display:flex; align-items:center; gap:10px; padding:13px 12px 10px; cursor:grab; }
  .col-head:active { cursor:grabbing; }
  .avatar {
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
    color:#fff; font-weight:700; font-size:15px; background:var(--c); box-shadow:0 2px 6px var(--cs); flex:none;
  }
  .col-name { font-size:18px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .count { font-size:14px; font-weight:700; color:var(--c); background:var(--csoft); border-radius:20px; padding:3px 11px; }
  .over-pill { font-size:12px; font-weight:700; color:#fff; background:#e0556b; border-radius:20px; padding:2px 8px; margin-left:5px; }

  .tasks { padding:2px 12px; overflow-y:auto; flex:1; min-height:30px; }
  .tasks.drag-over { background:var(--csoft); }

  .task {
    background:var(--card); border-radius:9px; box-shadow:0 1px 2px rgba(9,30,66,.18);
    padding:9px 11px; margin-bottom:8px; animation:pop .18s ease;
  }
  @keyframes pop { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:none;} }
  .task.clickable { cursor:pointer; }
  .task.clickable:hover { box-shadow:0 2px 8px rgba(9,30,66,.22); }
  .task.done { opacity:.6; }
  .sortable-ghost { opacity:.35; }
  .sortable-chosen { box-shadow:0 8px 22px rgba(9,30,66,.28); }

  .t-labels { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .t-label { display:inline-flex; align-items:center; padding:2px 9px; border-radius:5px; font-size:11px; font-weight:700; color:#fff; line-height:1.5; }
  .task-main { display:flex; align-items:flex-start; gap:9px; }
  .pdot { width:8px; height:8px; border-radius:50%; flex:none; margin-top:7px; }
  .pdot.high{ background:#e0556b; } .pdot.med{ background:#f3a93c; } .pdot.low{ background:#c4cdd6; }
  .check {
    width:22px; height:22px; flex:none; margin-top:0; border:2px solid #cdd6df;
    border-radius:6px; cursor:pointer; display:grid; place-items:center; transition:all .12s;
  }
  .check.on { background:var(--c); border-color:var(--c); }
  .check.on::after { content:"✓"; color:#fff; font-size:13px; font-weight:800; }
  .txt { flex:1; font-size:16px; line-height:1.4; word-break:break-word; padding-top:1px; }
  .task.done .txt { text-decoration:line-through; }

  .badges { display:flex; flex-wrap:wrap; gap:6px; margin:7px 0 0 31px; }
  .due { font-size:13px; font-weight:700; border-radius:7px; padding:2px 10px; display:inline-flex; gap:4px; align-items:center; }
  .due.over { background:#fdeaed; color:#d23f57; }
  .due.today { background:#fff1e3; color:#e07c1a; }
  .due.soon { background:#fff8e6; color:#bb8a1a; }
  .due.later { background:#eef1f5; color:#7d8a98; }
  .rep-badge { background:#eef4ff; color:#3b72d6; }
  .t-meta { display:flex; flex-wrap:wrap; gap:11px; margin:7px 0 0 31px; font-size:12px; color:var(--muted); font-weight:700; }
  .t-meta span { display:inline-flex; gap:3px; align-items:center; }
  .t-meta span[data-tip] { cursor:help; }
  .t-meta .chk-done { color:#10b981; }
  #hovertip {
    position:fixed; z-index:80; max-width:280px; background:#1d2733; color:#fff;
    padding:9px 11px; border-radius:8px; font-size:13px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; box-shadow:0 6px 20px rgba(9,30,66,.4);
    pointer-events:none; display:none;
  }
  body.dark #hovertip { background:#0f1316; border:1px solid #2c333a; }

  .pri { display:flex; gap:5px; flex-wrap:wrap; }
  .pri button { border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; color:#7d8a98; }
  .pri button.sel-high { border-color:#e0556b; color:#e0556b; background:#fdeaed; }
  .pri button.sel-med  { border-color:#f3a93c; color:#e07c1a; background:#fff1e3; }
  .pri button.sel-low  { border-color:#9aa6b2; color:#7d8a98; background:#eef1f5; }
  .pri button.sel-rep  { border-color:#3b72d6; color:#3b72d6; background:#eef4ff; }

  /* ---- add a card ---- */
  .addcard { padding:8px 12px 12px; }
  .addcard-btn {
    width:100%; text-align:left; border:none; background:none; border-radius:8px; padding:8px 10px;
    font-size:15px; font-weight:600; color:var(--muted); cursor:pointer; transition:background .12s;
  }
  .addcard-btn:hover { background:rgba(9,30,66,.06); color:var(--ink); }
  .addcard-form { display:none; gap:7px; }
  .addcard-form.show { display:flex; }
  .addcard-form input {
    flex:1; border:1.5px solid var(--c); border-radius:8px; padding:9px 11px; font-size:15px;
    background:var(--card); color:var(--ink); outline:none; min-width:0;
  }
  .addcard-form button {
    border:none; background:var(--c); color:#fff; border-radius:8px; padding:0 14px;
    font-size:20px; font-weight:600; cursor:pointer; line-height:1; flex:none;
  }

  /* ---- done drawer ---- */
  .drawer-head {
    display:flex; align-items:center; gap:8px; padding:9px 16px 12px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--muted); user-select:none;
  }
  .drawer-head .caret { transition:transform .15s; }
  .drawer-head.open .caret { transform:rotate(90deg); }
  .drawer-body { padding:0 12px 8px; }
  .drawer-body.hide { display:none; }
  .col-empty { text-align:center; color:var(--muted); font-size:14px; padding:14px 8px; }

  /* ---- history ---- */
  .history.hide { display:none; }
  .history { max-width:780px; }
  .hist-h { font-size:22px; font-weight:800; margin-bottom:4px; }
  .hist-sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .hist-row {
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 14px; margin-bottom:8px;
  }
  .hist-dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .hist-txt { flex:1; font-size:16px; text-decoration:line-through; color:var(--muted); }
  .hist-who { font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .hist-when { font-size:13px; color:var(--muted); white-space:nowrap; }

  /* ---- right rail activity ---- */
  .act-item { display:flex; gap:9px; align-items:baseline; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .act-item:first-child { border-top:none; }
  .act-ico { flex:none; }
  .act-txt { flex:1; color:var(--ink); line-height:1.4; }
  .act-txt b { font-weight:700; }
  .act-time { flex:none; color:var(--muted); font-size:12px; }
  .act-empty { color:var(--muted); font-size:14px; padding:8px 0; }

  /* ---- footer ---- */
  .footbar {
    grid-area:footer; display:flex; align-items:center; gap:20px;
    padding:9px 22px; background:var(--card); border-top:1px solid var(--line); font-size:13px; color:var(--muted);
  }
  .footbar b { color:var(--ink); }
  .credit { margin-left:auto; opacity:.7; }
  .err { color:#e0556b; }

  /* ---- collapsible activity rail ---- */
  .collapsebtn { border:none; background:none; color:var(--muted); font-size:16px; font-weight:800; cursor:pointer; line-height:1; letter-spacing:-3px; padding:0 4px; }
  .collapsebtn:hover { color:#0c66e4; }
  .actReopen {
    position:fixed; top:62px; right:8px; z-index:40; border:1.5px solid var(--line);
    background:var(--card); color:var(--muted); border-radius:8px; padding:7px 10px;
    font-size:13px; font-weight:800; letter-spacing:-2px; cursor:pointer; display:none;
    box-shadow:0 2px 8px rgba(9,30,66,.18);
  }
  .actReopen:hover { color:#0c66e4; }
  body.act-collapsed .right { display:none; }
  body.act-collapsed .actReopen { display:block; }
  @media (min-width:901px) { body.act-collapsed .app { grid-template-columns:240px 1fr 0; } }

  /* ---- modals ---- */
  .modal { position:fixed; inset:0; background:rgba(9,30,66,.45); display:grid; place-items:center; z-index:50; overflow:auto; padding:20px 0; }
  .modal.hide { display:none; }
  .modal-card { background:var(--card); border-radius:16px; padding:22px; width:340px; max-width:92vw; max-height:90vh; overflow:auto; box-shadow:0 18px 50px rgba(9,30,66,.3); }
  .modal-title { font-size:20px; font-weight:800; margin-bottom:16px; }
  #pmName, #lmName { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:17px; outline:none; background:var(--bg); color:var(--ink); }
  #pmName:focus, #lmName:focus { border-color:#4c9aff; }
  .swatches { display:flex; flex-wrap:wrap; gap:9px; margin:16px 0 6px; }
  .swatch { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform .1s; }
  .swatch:hover { transform:scale(1.1); }
  .swatch.sel { border-color:var(--ink); }
  .modal-actions { display:flex; align-items:center; gap:9px; margin-top:18px; }
  .modal-actions .hide { display:none; }
  .modal-actions button { border:none; border-radius:9px; padding:9px 16px; font-size:15px; font-weight:700; cursor:pointer; }
  .modal-actions .primary { background:#0c66e4; color:#fff; }
  .modal-actions .ghost { background:rgba(127,140,160,.18); color:var(--ink); }
  .modal-actions .danger { background:#fdeaed; color:#d23f57; }
  .modal-actions .complete-task { background:#10b981; color:#fff; padding:12px 22px; font-size:15px; font-weight:800; }
  .modal-actions .complete-task:hover { filter:brightness(1.06); }
  .modal-actions .complete-task.undo { background:transparent; color:var(--muted); border:1.5px solid var(--line); font-weight:700; }
  .modal-actions .tm-done { background:#0c66e4; color:#fff; padding:12px 22px; font-size:15px; font-weight:800; }
  .modal-actions .tm-done:hover { filter:brightness(1.06); }
  .pm-err { color:#e0556b; font-size:13px; margin-top:10px; min-height:16px; }

  /* ---- label manager rows ---- */
  .lman-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line); }
  .lman-row:first-child { border-top:none; }
  .lman-dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .lman-name { flex:1; font-weight:700; }
  .lman-row button { border:none; background:none; cursor:pointer; color:#aab4c0; font-size:14px; padding:2px 4px; }
  .lman-row button:hover { color:#0c66e4; }

  /* ---- task detail modal ---- */
  .tm-card { width:560px; max-width:94vw; }
  .tm-title { width:100%; border:1.5px solid transparent; border-radius:9px; padding:8px 10px; font-size:21px; font-weight:800; color:var(--ink); background:transparent; outline:none; }
  .tm-title:focus { border-color:#4c9aff; background:var(--bg); }
  .tm-meta-owner { font-size:13px; color:var(--muted); margin:2px 0 6px 10px; }
  .tm-sec { margin-top:16px; }
  .tm-h { font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .tm-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tm-date { border:1.5px solid var(--line); border-radius:8px; padding:6px 9px; font-size:14px; background:var(--bg); color:var(--ink); }
  .tm-notes { width:100%; min-height:62px; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px; color:var(--ink); background:var(--bg); outline:none; resize:vertical; font-family:inherit; }
  .tm-notes:focus { border-color:#4c9aff; }
  .ltoggle { display:inline-flex; align-items:center; gap:6px; border-radius:14px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; color:#fff; opacity:.38; transition:opacity .12s; }
  .ltoggle.on { opacity:1; }
  .chk-prog { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:9px; }
  .chk-prog > i { display:block; height:100%; background:#10b981; transition:width .2s; }
  .chk-list { display:flex; flex-direction:column; gap:5px; margin-bottom:9px; }
  .chk-item { display:flex; align-items:center; gap:9px; font-size:15px; }
  .chk-box { width:18px; height:18px; border:2px solid #cdd6df; border-radius:5px; cursor:pointer; display:grid; place-items:center; flex:none; }
  .chk-box.on { background:#10b981; border-color:#10b981; }
  .chk-box.on::after { content:"✓"; color:#fff; font-size:11px; font-weight:800; }
  .chk-text { flex:1; word-break:break-word; }
  .chk-item.done .chk-text { text-decoration:line-through; color:var(--muted); }
  .chk-del { border:none; background:none; color:#c4cdd6; cursor:pointer; font-size:15px; }
  .chk-del:hover { color:#e0556b; }
  .cmt { display:flex; gap:9px; padding:9px 0; border-top:1px solid var(--line); }
  .cmt:first-child { border-top:none; }
  .cmt-av { width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; }
  .cmt-b { flex:1; }
  .cmt-meta { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .cmt-meta b { color:var(--ink); }
  .cmt-text { font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .inrow { display:flex; gap:7px; align-items:flex-start; }
  .inrow input, .inrow textarea { flex:1; border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px; color:var(--ink); background:var(--bg); outline:none; font-family:inherit; }
  .inrow input:focus, .inrow textarea:focus { border-color:#4c9aff; }
  .miniadd { border:none; background:#0c66e4; color:#fff; border-radius:9px; padding:0 15px; height:38px; font-size:18px; font-weight:700; cursor:pointer; flex:none; }

  /* compact pill bar + collapsible sections */
  .tm-pills { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .tm-pill { display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--line); background:var(--bg); border-radius:16px; padding:6px 13px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  .tm-pill.unset { color:var(--muted); }
  .tm-pill.active { border-color:#0c66e4; box-shadow:0 0 0 2px #e6efff; }
  .tm-lchip { display:inline-flex; align-items:center; border-radius:14px; padding:6px 11px; font-size:12px; font-weight:700; color:#fff; }
  .tm-edit:not(:empty) { margin-top:10px; padding:10px; background:var(--bg); border:1px dashed var(--line); border-radius:9px; }

  .tm-acc-head.open .caret { transform:rotate(90deg); }

  /* ---- dark mode ---- */
  body.dark { --bg:#1d2125; --card:#22272b; --ink:#c7d1db; --muted:#8c9bab; --line:#2c333a; --rail:#1b1f23; --orb:#4f7cff; color-scheme:dark; }
  body.dark #orb { opacity:.42; }
  body.dark .col { background:#15191c; }
  body.dark .task { box-shadow:0 1px 2px rgba(0,0,0,.45); }
  body.dark .navbtn.active, body.dark .member.sel, body.dark .prifilter button.active, body.dark .lchip.active { background:#15395f; color:#9cc2ff; border-color:#15395f; }
  body.dark .prifilter button.active { border-color:#2f6dc0; }

  body.dark .due.over { background:#41212a; color:#ff8197; }
  body.dark .due.today { background:#3d2c17; color:#ffb567; }
  body.dark .due.soon { background:#3a3417; color:#e9c45c; }
  body.dark .due.later { background:#2c333a; color:#aab4c0; }

  body.dark .pri button.sel-low { background:#2c333a; }

</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, updateDoc, setDoc, doc,
  onSnapshot, query, orderBy, limit, serverTimestamp, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzhvgI9ygGqmyeP-5jPaIMn44PO0Wb3Ak",
  authDomain: "permai-family.firebaseapp.com",
  projectId: "permai-family",
  storageBucket: "permai-family.firebasestorage.app",
  messagingSenderId: "1050539460224",
  appId: "1:1050539460224:web:0357111582c97d31b98865"
};

const PRIO = { high:0, med:1, low:2 };
// maximally-distinct categorical palette (white text stays legible on every one)
const PALETTE = ["#e6194b","#4363d8","#3cb44b","#f58231","#911eb4","#008080","#f032e6","#9a6324","#800000","#000075"];
const DONE_WINDOW = 7 * 86400; // seconds
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const safeColor = (c) => /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : "#9aa6b2";   // colors reach style="" — keep them inert

const statusEl = document.getElementById("status");
const boardEl  = document.getElementById("board");

let db;
try { db = getFirestore(initializeApp(firebaseConfig)); }
catch (e) { statusEl.innerHTML = '<span class="err">Firebase init failed.</span>'; }
const tasksCol  = () => collection(db, "tasks");
const actCol    = () => collection(db, "activity");
const peopleCol = () => collection(db, "people");
const labelsCol = () => collection(db, "labels");

// ---- color helpers (one color stored per person; derive the rest) ----
function hexToRgba(h, a) {
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const vCS    = (hex) => hexToRgba(hex, .35);
const vCSOFT = (hex) => hexToRgba(hex, .12);

// ---- state ----
let people = [];
let labels = [];
let peopleLoaded = false;
let seeded = false, labelsSeeded = false;
let lastItems = [];
const drawerOpen = {};
const completing = new Set();
const sortables = {};
let boardSort = null;   // drag-reorder of the whole columns (people)
const filters = { search: "", person: null, priority: "all", label: null };
let showHistory = false;
let justDragged = false;   // suppress the post-drag synthetic click that would open the modal
let lastAct = [];
let lastColSig = null;

const personById = (id) => people.find(p => p.id === id) || { id, name: "Removed member", color: "#9aa6b2" };
const nameOf = (id) => personById(id).name;
const labelById = (id) => labels.find(l => l.id === id);
const getTask = (id) => (lastItems.find(x => x.id === id) || {}).t;

// ---- hover tooltip for card meta cues (read notes/checklist/comments without opening) ----
const hovertip = document.createElement("div");
hovertip.id = "hovertip";
document.body.appendChild(hovertip);
function showTip(text, e) {
  if (!text) return;
  hovertip.textContent = text;
  hovertip.style.display = "block";
  const pad = 12, r = hovertip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - pad) x = innerWidth - r.width - pad;
  if (y + r.height > innerHeight - pad) y = e.clientY - r.height - 14;
  hovertip.style.left = Math.max(pad, x) + "px";
  hovertip.style.top = Math.max(pad, y) + "px";
}
function hideTip() { hovertip.style.display = "none"; }
function tipFor(t, type) {
  if (type === "notes") return (t.notes || "").trim();
  if (type === "chk") return (t.checklist || []).map(c => (c.done ? "☑ " : "☐ ") + c.text).join("\n");
  if (type === "cmt") return (t.comments || []).slice().sort((a,b) => a.ts - b.ts).slice(-3).map(c => nameOf(c.by) + ": " + c.text).join("\n");
  return "";
}

// ---- celebration ----
let actx;
function chime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(actx.destination);
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
      o.start(t); o.stop(t + 0.32);
    });
  } catch (e) {}
}
function celebrate() {
  if (window.confetti) confetti({ particleCount: 70, spread: 62, startVelocity: 38, origin: { y: 0.75 } });
  chime();
}

// ---- activity ----
function addActivity(action, text, person) {
  addDoc(actCol(), { action, text, person, ts: serverTimestamp() }).catch(() => {});
}

// ---- task ops (NO delete — completing is the only way to clear a task) ----
const setDue    = (id, v) => updateDoc(doc(db,"tasks",id), { due: v || null });
const setPrio   = (id, p) => updateDoc(doc(db,"tasks",id), { priority: p });
const setRepeat = (id, r) => updateDoc(doc(db,"tasks",id), { repeat: r === "none" ? null : r });
const setText   = (id, v) => updateDoc(doc(db,"tasks",id), { text: v });
const setNotes  = (id, v) => updateDoc(doc(db,"tasks",id), { notes: v });
const uncomplete = (id) => updateDoc(doc(db,"tasks",id), { done:false, doneAt:null });

const curChecklist = (id) => (getTask(id)?.checklist) || [];
const curLabels    = (id) => (getTask(id)?.labels) || [];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
// appends use atomic arrayUnion so concurrent edits to the same card don't clobber each other
async function addCheckItem(id, text) {
  if (!text.trim()) return;
  await updateDoc(doc(db,"tasks",id), { checklist: arrayUnion({ id: uid(), text:text.trim(), done:false }) });
}
async function toggleCheckItem(id, itemId) {   // by stable id, not DOM index
  await updateDoc(doc(db,"tasks",id), { checklist: curChecklist(id).map(c => c.id===itemId ? { ...c, done:!c.done } : c) });
}
async function removeCheckItem(id, itemId) {
  await updateDoc(doc(db,"tasks",id), { checklist: curChecklist(id).filter(c => c.id!==itemId) });
}
async function toggleTaskLabel(id, lid) {
  await updateDoc(doc(db,"tasks",id), { labels: curLabels(id).includes(lid) ? arrayRemove(lid) : arrayUnion(lid) });
}
async function addComment(id, by, text) {
  if (!text.trim()) return;
  await updateDoc(doc(db,"tasks",id), { comments: arrayUnion({ by, text:text.trim(), ts: Date.now() }) });
}

function nextDue(due, repeat) {
  let base = due ? new Date(due + "T00:00:00") : new Date(new Date().setHours(0,0,0,0));
  const today = new Date(new Date().setHours(0,0,0,0));
  if (base < today) base = today;
  base.setDate(base.getDate() + (repeat === "weekly" ? 7 : 1));
  const y = base.getFullYear(), m = String(base.getMonth()+1).padStart(2,"0"), d = String(base.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

async function completeTask(id, t) {
  if (completing.has(id)) return;     // guard against double-click double-spawn
  completing.add(id);
  celebrate();
  addActivity("done", t.text, t.by);
  try {
    if (t.repeat === "daily" || t.repeat === "weekly") {
      await addDoc(tasksCol(), {
        text:t.text, done:false, by:t.by, priority:t.priority || "med",
        due: nextDue(t.due, t.repeat), repeat:t.repeat,
        labels:t.labels || [], checklist:(t.checklist||[]).map(c => ({ id:uid(), text:c.text, done:false })),
        created:serverTimestamp()
      });
    }
    await updateDoc(doc(db,"tasks",id), { done:true, doneAt:serverTimestamp() });
  } finally { completing.delete(id); }
}

function dueInfo(due) {
  if (!due) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(due + "T00:00:00");
  const diff = Math.round((d - t) / 86400000);
  const dstr = d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
  if (diff < 0)  return { cls:"over",  label:"Overdue · " + dstr };
  if (diff === 0) return { cls:"today", label:"Today" };
  if (diff === 1) return { cls:"today", label:"Tomorrow" };
  if (diff <= 3)  return { cls:"soon",  label:dstr };
  return { cls:"later", label:dstr };
}

function sortKey(a, b) {
  const pa = PRIO[a.t.priority] ?? 1, pb = PRIO[b.t.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a.t.due ? new Date(a.t.due).getTime() : Infinity;
  const dbb = b.t.due ? new Date(b.t.due).getTime() : Infinity;
  if (da !== dbb) return da - dbb;
  return (a.t.created?.seconds || 0) - (b.t.created?.seconds || 0);
}

const isRecentDone = (t) => t.done && (t.doneAt?.seconds || 0) >= (Date.now()/1000 - DONE_WINDOW);
const matchActive = (t) =>
  (!filters.search || (t.text || "").toLowerCase().includes(filters.search)) &&
  (filters.priority === "all" || (t.priority || "med") === filters.priority) &&
  (!filters.label || (t.labels || []).includes(filters.label));

// ---- card nodes (minimal front; click opens detail) ----
function activeNode(id, t) {
  const row = document.createElement("div");
  row.className = "task clickable";
  row.dataset.id = id;
  const di = dueInfo(t.due);
  const pr = t.priority || "med";
  const tl = (t.labels || []).map(labelById).filter(Boolean);
  const chk = t.checklist || []; const cdone = chk.filter(c => c.done).length;
  const ncm = (t.comments || []).length; const hasNotes = !!(t.notes && t.notes.trim());
  const meta = [];
  if (hasNotes) meta.push(`<span data-tip="notes">📝</span>`);
  if (chk.length) meta.push(`<span data-tip="chk" class="${cdone===chk.length?"chk-done":""}">✔ ${cdone}/${chk.length}</span>`);
  if (ncm) meta.push(`<span data-tip="cmt">💬 ${ncm}</span>`);
  row.innerHTML = `
    ${tl.length ? `<div class="t-labels">${tl.map(l => `<span class="t-label" style="background:${safeColor(l.color)}">${esc(l.name)}</span>`).join("")}</div>` : ""}
    <div class="task-main">
      <span class="pdot ${pr}" title="${pr} priority"></span>
      <div class="check"></div>
      <div class="txt"></div>
    </div>
    <div class="badges">
      ${di ? `<span class="due ${di.cls}">${di.label}</span>` : ""}
      ${t.repeat ? `<span class="due rep-badge">🔁 ${t.repeat}</span>` : ""}
    </div>
    ${meta.length ? `<div class="t-meta">${meta.join("")}</div>` : ""}`;
  row.querySelector(".txt").textContent = t.text;
  row.querySelector(".check").onclick = (e) => { e.stopPropagation(); completeTask(id, t); };
  row.onclick = () => { if (justDragged) return; openTask(id); };
  row.querySelectorAll(".t-meta span[data-tip]").forEach(s => {
    const tip = tipFor(t, s.dataset.tip);
    if (!tip) return;
    s.addEventListener("mouseenter", e => showTip(tip, e));
    s.addEventListener("mousemove", e => showTip(tip, e));
    s.addEventListener("mouseleave", hideTip);
  });
  return row;
}

function doneNode(id, t) {
  const row = document.createElement("div");
  row.className = "task done clickable";
  row.dataset.id = id;
  row.innerHTML = `
    <div class="task-main">
      <div class="check on"></div>
      <div class="txt"></div>
    </div>`;
  row.querySelector(".txt").textContent = t.text;
  row.querySelector(".check").onclick = (e) => { e.stopPropagation(); uncomplete(id); };
  row.onclick = () => { if (justDragged) return; openTask(id); };
  return row;
}

// ---- column shell (rebuilt whenever the set/order of people changes) ----
const colEls = {}, activeEls = {}, drawerHeadEls = {}, drawerBodyEls = {}, countEls = {}, overEls = {};
function renderColumns() {
  Object.values(sortables).forEach(s => { try { s.destroy(); } catch (e) {} });
  if (boardSort) { try { boardSort.destroy(); } catch (e) {} boardSort = null; }
  [sortables, colEls, activeEls, drawerHeadEls, drawerBodyEls, countEls, overEls]
    .forEach(m => { for (const k in m) delete m[k]; });
  Object.keys(drawerOpen).forEach(id => { if (!people.some(p => p.id === id)) delete drawerOpen[id]; });
  boardEl.innerHTML = "";

  for (const p of people) {
    if (!(p.id in drawerOpen)) drawerOpen[p.id] = false;
    const col = document.createElement("div");
    col.className = "col";
    col.dataset.pid = p.id;
    const sc = safeColor(p.color);
    col.style.setProperty("--c", sc);
    col.style.setProperty("--cs", vCS(sc));
    col.style.setProperty("--csoft", vCSOFT(sc));
    col.innerHTML = `
      <div class="col-head">
        <div class="avatar">${esc((p.name.charAt(0) || "?").toUpperCase())}</div>
        <div class="col-name">${esc(p.name)}</div>
        <div class="count" id="count-${p.id}">0</div>
        <div class="over-pill" id="over-${p.id}" style="display:none"></div>
      </div>
      <div class="tasks" id="list-${p.id}" data-owner="${p.id}"></div>
      <div class="addcard">
        <button class="addcard-btn" id="addbtn-${p.id}">+ Add a card</button>
        <div class="addcard-form" id="addform-${p.id}">
          <input type="text" placeholder="What needs doing?" autocomplete="off" id="in-${p.id}" />
          <button id="addsave-${p.id}">+</button>
        </div>
      </div>
      <div class="drawer">
        <div class="drawer-head" id="dh-${p.id}"><span class="caret">▶</span><span id="dl-${p.id}">Done</span></div>
        <div class="drawer-body hide" id="db-${p.id}"></div>
      </div>`;
    boardEl.appendChild(col);

    colEls[p.id]        = col;
    activeEls[p.id]     = col.querySelector(`#list-${p.id}`);
    drawerHeadEls[p.id] = col.querySelector(`#dh-${p.id}`);
    drawerBodyEls[p.id] = col.querySelector(`#db-${p.id}`);
    countEls[p.id]      = col.querySelector(`#count-${p.id}`);
    overEls[p.id]       = col.querySelector(`#over-${p.id}`);

    const input  = col.querySelector(`#in-${p.id}`);
    const form   = col.querySelector(`#addform-${p.id}`);
    const addBtn = col.querySelector(`#addbtn-${p.id}`);
    const owner  = p.id;
    const addFn = async () => {
      const text = input.value.trim();
      if (!text || !db) return;
      try {
        await addDoc(tasksCol(), { text, done:false, by:owner, priority:"med", due:null, repeat:null, created:serverTimestamp() });
        addActivity("add", text, owner);
        input.value = "";
      } catch (e) { statusEl.innerHTML = '<span class="err">Could not save — check Firestore rules.</span>'; }
    };
    addBtn.onclick = () => { addBtn.style.display = "none"; form.classList.add("show"); input.focus(); };
    col.querySelector(`#addsave-${p.id}`).onclick = addFn;
    input.addEventListener("keydown", e => { if (e.key === "Enter") addFn(); });
    input.addEventListener("blur", () => {
      if (!input.value.trim()) { form.classList.remove("show"); addBtn.style.display = "block"; }
    });

    drawerHeadEls[p.id].onclick = () => { drawerOpen[p.id] = !drawerOpen[p.id]; renderBoard(); };

    sortables[p.id] = new Sortable(activeEls[p.id], {
      group: "tasks", animation: 150, draggable: ".task",
      filter: ".check,input,button,.t-meta",
      preventOnFilter: false,
      onEnd: () => { justDragged = true; setTimeout(() => { justDragged = false; }, 0); },
      onAdd: (evt) => {
        const id = evt.item.dataset.id;
        const to = evt.to.dataset.owner;
        if (id && to) {
          updateDoc(doc(db, "tasks", id), { by: to });
          const it = lastItems.find(x => x.id === id);
          if (it) addActivity("move", it.t.text, to);
        }
      }
    });
  }

  // drag a column by its header to reorder members; persist each person's order
  boardSort = new Sortable(boardEl, {
    draggable: ".col", handle: ".col-head", animation: 150,
    onEnd: () => {
      [...boardEl.querySelectorAll(".col")].forEach((c, i) => {
        if (c.dataset.pid) updateDoc(doc(db, "people", c.dataset.pid), { order: i }).catch(() => {});
      });
    }
  });
}

function syncColumns() {
  const sig = people.map(p => p.id).join("|");
  if (sig !== lastColSig) { lastColSig = sig; renderColumns(); }
  else updateColMeta();
}
function updateColMeta() {
  for (const p of people) {
    const col = colEls[p.id];
    if (!col) continue;
    const sc = safeColor(p.color);
    col.style.setProperty("--c", sc);
    col.style.setProperty("--cs", vCS(sc));
    col.style.setProperty("--csoft", vCSOFT(sc));
    const av = col.querySelector(".avatar");
    if (av) av.textContent = (p.name.charAt(0) || "?").toUpperCase();
    const nm = col.querySelector(".col-name");
    if (nm) nm.textContent = p.name;
  }
}

function renderBoard() {
  if (!peopleLoaded) return;
  const active = {}, done = {}, activeCount = {}, overdue = {};
  people.forEach(p => { active[p.id] = []; done[p.id] = []; activeCount[p.id] = 0; overdue[p.id] = 0; });
  const matchSearch = (t) => !filters.search || (t.text || "").toLowerCase().includes(filters.search);
  lastItems.forEach(({ id, t }) => {
    if (active[t.by] == null) return;
    if (t.done) {
      if (isRecentDone(t) && matchSearch(t)) done[t.by].push({ id, t });
    } else {
      activeCount[t.by]++;                                          // true (unfiltered) count for badge
      if ((dueInfo(t.due) || {}).cls === "over") overdue[t.by]++;   // overdue stays accurate under filters
      if (matchActive(t)) active[t.by].push({ id, t });
    }
  });

  for (const p of people) {
    const a = active[p.id].sort(sortKey);
    const d = done[p.id].sort((x,y) => (y.t.doneAt?.seconds||0)-(x.t.doneAt?.seconds||0));

    const col = colEls[p.id];
    if (col) {
      col.classList.toggle("dim", filters.person && p.id !== filters.person);
      col.style.display = (filters.search && !a.length && !d.length) ? "none" : "";  // hide columns with no match while searching
    }

    const el = activeEls[p.id];
    el.innerHTML = "";
    if (!a.length) el.innerHTML = '<div class="col-empty">No tasks — drag one here or add below</div>';
    else a.forEach(({ id, t }) => el.appendChild(activeNode(id, t)));

    countEls[p.id].textContent = activeCount[p.id];
    overEls[p.id].style.display = overdue[p.id] ? "inline-block" : "none";
    overEls[p.id].textContent = overdue[p.id] ? overdue[p.id] + " overdue" : "";

    document.getElementById(`dl-${p.id}`).textContent = "Done · last 7 days (" + d.length + ")";
    drawerHeadEls[p.id].classList.toggle("open", drawerOpen[p.id]);
    const body = drawerBodyEls[p.id];
    body.classList.toggle("hide", !drawerOpen[p.id]);
    body.innerHTML = "";
    if (drawerOpen[p.id]) {
      if (!d.length) body.innerHTML = '<div class="col-empty">Nothing done in the last 7 days</div>';
      else d.forEach(({ id, t }) => body.appendChild(doneNode(id, t)));
    }
  }
  renderMembers();
}

// ---- history (completed > 7 days ago, kept in DB, read-only) ----
function renderHistory() {
  const sec = (t) => t.doneAt?.seconds || t.created?.seconds || 0;
  const rows = lastItems
    .filter(({ t }) => t.done && !isRecentDone(t))
    .filter(({ t }) => !filters.search || (t.text || "").toLowerCase().includes(filters.search))
    .sort((x, y) => sec(y.t) - sec(x.t));
  const host = document.getElementById("history");
  let html = `<div class="hist-h">🗄️ History</div>
    <div class="hist-sub">Completed tasks older than 7 days. Kept here so the board stays clear — read-only.</div>`;
  if (!rows.length) {
    html += `<div class="col-empty">Nothing archived yet.</div>`;
  } else {
    html += rows.map(({ t }) => {
      const pr = personById(t.by);
      const when = sec(t) ? new Date(sec(t) * 1000).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }) : "";
      return `<div class="hist-row">
        <span class="hist-dot" style="background:${safeColor(pr.color)}"></span>
        <span class="hist-txt">${esc(t.text)}</span>
        <span class="hist-who">${esc(pr.name)}</span>
        <span class="hist-when">${when}</span>
      </div>`;
    }).join("");
  }
  host.innerHTML = html;
}

// ---- left rail: members + label filter ----
function renderMembers() {
  const host = document.getElementById("memberList");
  host.innerHTML = "";
  people.forEach(p => {
    const activeCount = lastItems.filter(x => x.t.by === p.id && !x.t.done).length;
    const row = document.createElement("div");

}

  const host = document.getElementById("labelFilter");

const tmCmtNew = document.getElementById("tmCmtNew");
let openTaskId = null;
let tmPill = null;                                   // which pill editor is open (due/prio/repeat/labels)
const tmShow = { notes:false, chk:false, cmt:false }; // which content sections are expanded
const modalHasFocus = () => taskModal.contains(document.activeElement);

function openTask(id) {
  openTaskId = id; tmPill = null;
  tmShow.notes = false; tmShow.chk = true; tmShow.cmt = true;   // checklist + comments open by default
  taskModal.classList.remove("hide"); renderTaskModal();
}
function closeTask() { openTaskId = null; taskModal.classList.add("hide"); }

function renderTaskModal() {
  if (!openTaskId) return;
  const id = openTaskId;
  const t = getTask(id);
  if (!t) { closeTask(); return; }

  if (document.activeElement !== tmTitle) tmTitle.value = t.text || "";
  if (document.activeElement !== tmNotes) tmNotes.value = t.notes || "";

  const owner = personById(t.by);
  document.getElementById("tmOwner").innerHTML =
    `in <b style="color:${safeColor(owner.color)}">${esc(owner.name)}</b>'s list${t.done ? " · ✅ completed" : ""}`;

  const pr = t.priority || "med", rep = t.repeat || "none";
  const di = dueInfo(t.due);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const setL = (t.labels || []).map(labelById).filter(Boolean);
  const prColor = pr === "high" ? "#e0556b" : pr === "low" ? "#7d8a98" : "#e07c1a";

  // ---- pill bar (overview; click a pill to edit) ----
  const pills = document.getElementById("tmPills");
  pills.innerHTML =
    `<span class="tm-pill ${t.due?"":"unset"} ${tmPill==="due"?"active":""}" data-pill="due">📅 ${t.due ? esc(di.label) : "Due"}</span>` +
    `<span class="tm-pill ${tmPill==="prio"?"active":""}" data-pill="prio" style="color:${prColor}">🚩 ${cap(pr)}</span>` +
    `<span class="tm-pill ${t.repeat?"":"unset"} ${tmPill==="repeat"?"active":""}" data-pill="repeat">🔁 ${t.repeat ? cap(t.repeat) : "Repeat"}</span>` +
    setL.map(l => `<span class="tm-lchip" style="background:${safeColor(l.color)}">${esc(l.name)}</span>`).join("") +
    `<span class="tm-pill ${tmPill==="labels"?"active":""}" data-pill="labels">🏷 ${setL.length ? "Edit" : "+ Label"}</span>`;
  pills.querySelectorAll(".tm-pill").forEach(p =>
    p.onclick = () => { tmPill = tmPill === p.dataset.pill ? null : p.dataset.pill; renderTaskModal(); });

  // ---- inline editor for the active pill ----
  const ep = document.getElementById("tmEditPanel");
  ep.innerHTML = "";
  if (tmPill === "due") {
    ep.innerHTML = `<div class="tm-row"><input type="date" class="tm-date" id="tmDue" value="${t.due || ""}" /><button class="clrbtn" id="tmDueClr">clear</button></div>`;
    ep.querySelector("#tmDue").onchange = (e) => { setDue(id, e.target.value); tmPill = null; renderTaskModal(); };
    ep.querySelector("#tmDueClr").onclick = () => { setDue(id, ""); tmPill = null; renderTaskModal(); };
  } else if (tmPill === "prio") {
    ep.innerHTML = `<div class="pri">
      <button data-p="high" class="${pr==="high"?"sel-high":""}">High</button>
      <button data-p="med"  class="${pr==="med" ?"sel-med" :""}">Med</button>
      <button data-p="low"  class="${pr==="low" ?"sel-low" :""}">Low</button></div>`;
    ep.querySelectorAll("button").forEach(b => b.onclick = () => { setPrio(id, b.dataset.p); tmPill = null; renderTaskModal(); });
  } else if (tmPill === "repeat") {
    ep.innerHTML = `<div class="pri rep">
      <button data-r="none"   class="${rep==="none"  ?"sel-rep":""}">No repeat</button>
      <button data-r="daily"  class="${rep==="daily" ?"sel-rep":""}">Daily</button>
      <button data-r="weekly" class="${rep==="weekly"?"sel-rep":""}">Weekly</button></div>`;
    ep.querySelectorAll("button").forEach(b => b.onclick = () => { setRepeat(id, b.dataset.r); tmPill = null; renderTaskModal(); });
  } else if (tmPill === "labels") {
    if (!labels.length) ep.innerHTML = '<span style="color:var(--muted);font-size:13px">No labels yet — use “manage” in the sidebar.</span>';
    else {
      ep.innerHTML = `<div class="tm-row">${labels.map(l => {
        const on = (t.labels || []).includes(l.id);
        return `<span class="ltoggle ${on?"on":""}" data-l="${l.id}" style="background:${safeColor(l.color)}">${esc(l.name)}</span>`;
      }).join("")}</div>`;
      ep.querySelectorAll(".ltoggle").forEach(s => s.onclick = () => toggleTaskLabel(id, s.dataset.l));
    }
  }

  // ---- notes (collapsible) ----
  const notesPrev = (t.notes || "").trim().replace(/\s+/g, " ");
  const notesHead = document.getElementById("tmNotesHead");
  notesHead.className = "tm-acc-head" + (tmShow.notes ? " open" : "");
  notesHead.innerHTML = `<span>📝 Notes</span><span class="summary">${notesPrev ? esc(notesPrev.slice(0,42)) + (notesPrev.length>42?"…":"") : "none"}</span><span class="caret">▶</span>`;
  document.getElementById("tmNotesBody").classList.toggle("hide", !tmShow.notes);

  // ---- checklist (collapsible) ----
  const chk = t.checklist || []; const cdone = chk.filter(c => c.done).length;
  const chkHead = document.getElementById("tmChkHead");
  chkHead.className = "tm-acc-head" + (tmShow.chk ? " open" : "");

  document.getElementById("tmChkBar").style.width = chk.length ? Math.round(cdone/chk.length*100) + "%" : "0%";
  const chkHost = document.getElementById("tmChk");
  chkHost.innerHTML = chk.map((c) => `<div class="chk-item ${c.done?"done":""}">

      <button class="chk-del" data-i="${c.id}" title="Remove">×</button>

  chkHost.querySelectorAll(".chk-box").forEach(b => b.onclick = () => toggleCheckItem(id, b.dataset.i));
  chkHost.querySelectorAll(".chk-del").forEach(b => b.onclick = () => removeCheckItem(id, b.dataset.i));

  const cm = (t.comments || []).slice().sort((a,b) => a.ts - b.ts);
  const cmtHead = document.getElementById("tmCmtHead");
  cmtHead.className = "tm-acc-head" + (tmShow.cmt ? " open" : "");
  cmtHead.innerHTML = `<span>💬 Comments</span><span class="summary">${cm.length || "none"}</span><span class="caret">▶</span>`;
  document.getElementById("tmCmtBody").classList.toggle("hide", !tmShow.cmt);
  const ch = document.getElementById("tmComments");
  ch.innerHTML = cm.length ? cm.map(c => {
    const p = personById(c.by);
    return `<div class="cmt">
      <span class="cmt-av" style="background:${safeColor(p.color)}">${esc((p.name.charAt(0)||"?").toUpperCase())}</span>
      <div class="cmt-b"><div class="cmt-meta"><b>${esc(p.name)}</b> · ${relTime(Math.floor(c.ts/1000))}</div><div class="cmt-text">${esc(c.text)}</div></div>
    </div>`;
  }).join("") : '<div class="act-empty">No comments yet.</div>';

  const cb = document.getElementById("tmComplete");
  cb.textContent = t.done ? "↩ Un-complete" : "✅ Complete task";
  cb.className = t.done ? "complete-task undo" : "complete-task";
}

  let w = localStorage.getItem("permai_whoami");
  if (!people.some(p => p.id === w)) w = people[0]?.id || null;
  return w;
}
function renderWhoami() {
  const sel = document.getElementById("whoami");
  const cur = getWhoami();
  sel.innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  if (cur) sel.value = cur;
}
document.getElementById("whoami").onchange = (e) => localStorage.setItem("permai_whoami", e.target.value);

// ---- dark mode ----
function applyTheme() {
  const dark = localStorage.getItem("permai_theme") !== "light";   // default dark for new devices
  document.body.classList.toggle("dark", dark);
  document.getElementById("themeBtn").textContent = dark ? "☀️" : "🌙";
}
document.getElementById("themeBtn").onclick = () => {
  const isDark = localStorage.getItem("permai_theme") !== "light";   // matches the default-dark logic
  localStorage.setItem("permai_theme", isDark ? "light" : "dark");
  applyTheme();
};
applyTheme();

// ---- collapsible activity rail ----
function applyAct() {
  document.body.classList.toggle("act-collapsed", localStorage.getItem("permai_act") !== "on");   // default collapsed for new devices
}
document.getElementById("actToggle").onclick  = () => { localStorage.setItem("permai_act", "off"); applyAct(); };
document.getElementById("actReopen").onclick = () => { localStorage.setItem("permai_act", "on");  applyAct(); };
applyAct();

// ---- ambient orb: big, translucent, drifts slowly + bounces off the edges (behind the board) ----
const orb = document.getElementById("orb");
const orbBtn = document.getElementById("orbBtn");
let ox = innerWidth * 0.88, oy = innerHeight * 0.85, vx = -0.396, vy = -0.307, orbRaf = null;
function orbLoop() {
  ox += vx; oy += vy;
  if (ox < 0 || ox > innerWidth)  vx = -vx;   // slow bounce off the viewport edges
  if (oy < 0 || oy > innerHeight) vy = -vy;
  orb.style.transform = `translate(${ox}px, ${oy}px)`;
  orbRaf = requestAnimationFrame(orbLoop);
}
function applyOrb() {
  const pref = localStorage.getItem("permai_orb") !== "off";   // user preference (default on)
  const canRun = pref && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  orb.style.display = canRun ? "block" : "none";
  orbBtn.classList.toggle("off", !pref);
  document.getElementById("orbState").textContent = pref ? "On" : "Off";
  if (canRun && !orbRaf) orbLoop();
  if (!canRun && orbRaf) { cancelAnimationFrame(orbRaf); orbRaf = null; }
}
orbBtn.onclick = () => { localStorage.setItem("permai_orb", localStorage.getItem("permai_orb") === "off" ? "on" : "off"); applyOrb(); };
applyOrb();

// ---- footer ----
function updateFooter() {
  const total = lastItems.length;
  const done = lastItems.filter(x => x.t.done).length;
  const active = total - done;
  document.getElementById("footCounts").innerHTML =
    `<b>${active}</b> active · <b>${done}</b> done · <b>${total}</b> total`;
}

// ---- activity rail ----
function relTime(sec) {
  if (!sec) return "just now";
  const diff = Math.floor(Date.now()/1000 - sec);
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
const ACT = {
  add:  { ico:"➕", verb:"added",     prep:"for" },
  done: { ico:"✅", verb:"completed", prep:"·"   },
  move: { ico:"↔️", verb:"moved",     prep:"to"  }
};
function renderActivity(rows) {
  const body = document.getElementById("act-body");
  if (!rows.length) { body.innerHTML = '<div class="act-empty">No activity yet.</div>'; return; }
  body.innerHTML = "";
  rows.forEach(a => {
    const meta = ACT[a.action] || { ico:"•", verb:a.action, prep:"" };
    const item = document.createElement("div");
    item.className = "act-item";
    const txt = document.createElement("div");
    txt.className = "act-txt";
    txt.innerHTML = `${meta.verb} <b></b> ${meta.prep} <span class="act-name"></span>`;
    txt.querySelector("b").textContent = '"' + a.text + '"';
    txt.querySelector(".act-name").textContent = nameOf(a.person);
    item.innerHTML = `<span class="act-ico">${meta.ico}</span>`;
    item.appendChild(txt);
    const time = document.createElement("span");
    time.className = "act-time";
    time.textContent = relTime(a.ts?.seconds);
    item.appendChild(time);
    body.appendChild(item);
  });
}

// ---- view + filter wiring ----
function refresh() {
  renderBoard();
  if (showHistory) renderHistory();
  if (openTaskId && !modalHasFocus()) renderTaskModal();
}

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long" });

document.getElementById("search").addEventListener("input", (e) => {
  filters.search = e.target.value.trim().toLowerCase();
  refresh();
});
document.querySelectorAll("#priFilter button").forEach(b => {
  b.onclick = () => {
    filters.priority = b.dataset.p;
    document.querySelectorAll("#priFilter button").forEach(x => x.classList.toggle("active", x === b));
    renderBoard();
  };
});
function setView(history) {
  showHistory = history;
  document.getElementById("board").style.display = history ? "none" : "flex";
  document.getElementById("history").classList.toggle("hide", !history);
  document.getElementById("nav-board").classList.toggle("active", !history);
  document.getElementById("nav-history").classList.toggle("active", history);
  if (history) renderHistory();
}
document.getElementById("nav-board").onclick = () => setView(false);
document.getElementById("nav-history").onclick = () => setView(true);

// ---- seeding (first run only) ----
const LEGACY = [
  { id:"NICK", name:"Nick", color:"#3b82f6", order:0 },
  { id:"IVY",  name:"Ivy",  color:"#10b981", order:1 },
  { id:"FYB",  name:"FYB",  color:"#8b5cf6", order:2 }
];
async function seedLegacy() {
  try {
    for (const p of LEGACY)
      await setDoc(doc(db, "people", p.id), { name:p.name, color:p.color, order:p.order, created:serverTimestamp() });
  } catch (e) { seeded = false; statusEl.innerHTML = '<span class="err">Could not seed members — check Firestore rules for /people.</span>'; }
}
const SEED_LABELS = [
  { id:"clinic",   name:"Clinic",    color:"#0ea5e9", order:0 },
  { id:"home",     name:"Home",      color:"#10b981", order:1 },
  { id:"urgent",   name:"Urgent",    color:"#ef4444", order:2 },
  { id:"errand",   name:"Errand",    color:"#f59e0b", order:3 },
  { id:"followup", name:"Follow-up", color:"#8b5cf6", order:4 }
];
async function seedLabels() {   // fixed ids + setDoc → idempotent, survives a partial first run
  try { for (const l of SEED_LABELS) await setDoc(doc(db,"labels",l.id), { name:l.name, color:l.color, order:l.order, created:serverTimestamp() }); }
  catch (e) { labelsSeeded = false; }
}

// ---- listeners ----
if (db) {
  onSnapshot(query(peopleCol(), orderBy("order","asc")), snap => {
    if (snap.empty && !seeded) { seeded = true; seedLegacy(); return; }
    people = [];
    snap.forEach(d => people.push({ id:d.id, ...d.data() }));
    peopleLoaded = true;
    renderWhoami();
    syncColumns();
    refresh();
    renderActivity(lastAct);   // re-resolve member names now that people are loaded/changed
  }, err => { statusEl.innerHTML = '<span class="err">People sync error: ' + err.code + '</span>'; });

  onSnapshot(query(labelsCol(), orderBy("order","asc")), snap => {
    if (snap.empty && !labelsSeeded) { labelsSeeded = true; seedLabels(); return; }
    labels = [];
    snap.forEach(d => labels.push({ id:d.id, ...d.data() }));
    renderLabelFilter();
    renderBoard();
    if (!taskModal.classList.contains("hide") && !modalHasFocus()) renderTaskModal();
  }, () => {});

  // NOTE: no orderBy — orderBy(F) silently drops docs missing F; we sort client-side (sortKey/history)
  onSnapshot(tasksCol(), snap => {
    lastItems = [];
    snap.forEach(dd => lastItems.push({ id: dd.id, t: dd.data() }));
    updateFooter();
    refresh();
    const n = snap.size;
    statusEl.textContent = "Live · " + n + " task" + (n === 1 ? "" : "s");
  }, err => { statusEl.innerHTML = '<span class="err">Connection error: ' + err.code + '</span>'; });

  onSnapshot(query(actCol(), orderBy("ts","desc"), limit(25)), snap => {
    lastAct = []; snap.forEach(d => lastAct.push(d.data()));
    renderActivity(lastAct);
  }, () => {});
}
</script>
