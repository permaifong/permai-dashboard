<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PERMAI TASK LIST</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root { --bg:#eef1f5; --card:#fff; --ink:#1d2733; --muted:#93a1b0; --line:#e6ebf0; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:linear-gradient(160deg,#eef1f5 0%,#e4e9f0 100%);
    color:var(--ink); min-height:100vh; padding:28px 18px 60px;
  }
  .wrap { width:75%; margin:0 auto; }
  header { text-align:center; margin-bottom:26px; }
  h1 { font-size:48px; font-weight:800; letter-spacing:0.5px; }
  .sub { color:var(--muted); font-size:18px; margin-top:7px; }

  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:760px){ .board{ grid-template-columns:1fr; } .wrap{ width:auto; } }

  .col {
    background:var(--card); border-radius:18px;
    box-shadow:0 6px 24px rgba(40,60,90,0.07); overflow:hidden;
    display:flex; flex-direction:column; border-top:5px solid var(--c);
  }
  .col-head { display:flex; align-items:center; gap:11px; padding:16px 18px 14px; }
  .avatar {
    width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
    color:#fff; font-weight:700; font-size:22px; background:var(--c);
    box-shadow:0 3px 10px var(--cs); flex:none;
  }
  .col-name { font-size:24px; font-weight:700; flex:1; }
  .count { font-size:17px; font-weight:700; color:var(--c); background:var(--csoft); border-radius:20px; padding:4px 13px; }
  .over-pill { font-size:13px; font-weight:700; color:#fff; background:#e0556b; border-radius:20px; padding:3px 9px; margin-left:6px; }

  .add { display:flex; gap:8px; padding:0 14px 12px; }
  .add input {
    flex:1; border:1.5px solid var(--line); border-radius:11px; padding:11px 13px;
    font-size:19px; background:#fafbfc; color:var(--ink); outline:none; transition:border-color .15s; min-width:0;
  }
  .add input:focus { border-color:var(--c); background:#fff; }
  .add button {
    border:none; background:var(--c); color:#fff; border-radius:11px; padding:0 15px;
    font-size:24px; font-weight:600; cursor:pointer; line-height:1; flex:none; transition:transform .1s,filter .15s;
  }
  .add button:hover { filter:brightness(1.05); }
  .add button:active { transform:scale(0.92); }

  .tasks { padding:0 14px 6px; flex:1; min-height:52px; }
  .tasks.drag-over { background:var(--csoft); border-radius:12px; }

  .task {
    background:#fafbfc; border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:9px; animation:pop .18s ease;
  }
  @keyframes pop { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:none;} }
  .task.done { opacity:.5; }
  .sortable-ghost { opacity:.35; }
  .sortable-chosen { box-shadow:0 8px 22px rgba(40,60,90,.18); }

  .task-main { display:flex; align-items:flex-start; gap:10px; }
  .pdot { width:9px; height:9px; border-radius:50%; flex:none; margin-top:8px; }
  .pdot.high{ background:#e0556b; } .pdot.med{ background:#f3a93c; } .pdot.low{ background:#c4cdd6; }
  .check {
    width:25px; height:25px; flex:none; margin-top:1px; border:2px solid #cdd6df;
    border-radius:7px; cursor:pointer; display:grid; place-items:center; transition:all .12s;
  }
  .check.on { background:var(--c); border-color:var(--c); }
  .check.on::after { content:"✓"; color:#fff; font-size:15px; font-weight:800; }
  .txt { flex:1; font-size:20px; line-height:1.4; word-break:break-word; padding-top:1px; cursor:grab; }
  .task.done .txt { text-decoration:line-through; }
  .icbtn { border:none; background:none; color:#c4cdd6; font-size:18px; cursor:pointer; flex:none; padding:0 3px; line-height:1; transition:color .15s; }
  .icbtn:hover { color:#7d8a98; }
  .icbtn.del:hover { color:#e0556b; }
  .icbtn.editing { color:#10b981; font-size:18px; font-weight:800; }
  .icbtn.editing:hover { color:#0e9e72; }

  .badges { display:flex; flex-wrap:wrap; gap:6px; margin:7px 0 0 31px; }
  .due {
    font-size:15px; font-weight:700; border-radius:7px; padding:3px 11px; display:inline-flex; gap:4px; align-items:center;
  }
  .due.over { background:#fdeaed; color:#d23f57; }
  .due.today { background:#fff1e3; color:#e07c1a; }
  .due.soon { background:#fff8e6; color:#bb8a1a; }
  .due.later { background:#eef1f5; color:#7d8a98; }
  .rep-badge { background:#eef4ff; color:#3b72d6; }

  .editor { margin:9px 0 2px; padding:10px; background:#fff; border:1px dashed var(--line); border-radius:10px; }
  .editor.hide { display:none; }
  .erow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .editor label { font-size:13px; color:var(--muted); font-weight:600; min-width:54px; }
  .editor input[type=date] { border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:16px; color:var(--ink); }
  .pri { display:flex; gap:5px; }
  .pri button {
    border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:5px 11px;
    font-size:13px; font-weight:700; cursor:pointer; color:#7d8a98;
  }
  .pri button.sel-high { border-color:#e0556b; color:#e0556b; background:#fdeaed; }
  .pri button.sel-med  { border-color:#f3a93c; color:#e07c1a; background:#fff1e3; }
  .pri button.sel-low  { border-color:#9aa6b2; color:#7d8a98; background:#eef1f5; }
  .pri button.sel-rep  { border-color:#3b72d6; color:#3b72d6; background:#eef4ff; }
  .clr { border:none; background:none; color:#aeb8c2; font-size:13px; cursor:pointer; text-decoration:underline; }

  .drawer { border-top:1px solid var(--line); margin:4px 0 0; }
  .drawer-head {
    display:flex; align-items:center; gap:8px; padding:11px 16px; cursor:pointer;
    font-size:14px; font-weight:700; color:var(--muted); user-select:none;
  }
  .drawer-head .caret { transition:transform .15s; }
  .drawer-head.open .caret { transform:rotate(90deg); }
  .drawer-body { padding:0 14px 10px; }
  .drawer-body.hide { display:none; }

  .col-empty { text-align:center; color:var(--muted); font-size:16px; padding:18px 0; }

  /* activity */
  .activity {
    width:75%; margin:26px auto 0; background:var(--card); border-radius:16px;
    box-shadow:0 6px 24px rgba(40,60,90,0.07); overflow:hidden;
  }
  @media (max-width:760px){ .activity{ width:auto; } }
  .act-head {
    display:flex; align-items:center; gap:8px; padding:14px 18px; cursor:pointer;
    font-size:16px; font-weight:700; user-select:none;
  }
  .act-head .caret { transition:transform .15s; color:var(--muted); }
  .act-head.open .caret { transform:rotate(90deg); }
  .act-body { padding:0 18px 14px; max-height:300px; overflow-y:auto; }
  .act-body.hide { display:none; }
  .act-item { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--line); font-size:15px; }
  .act-item:first-child { border-top:none; }
  .act-ico { flex:none; }
  .act-txt { flex:1; color:var(--ink); }
  .act-txt b { font-weight:700; }
  .act-time { flex:none; color:var(--muted); font-size:13px; }
  .act-empty { color:var(--muted); font-size:14px; padding:10px 0; }

  .status { text-align:center; font-size:14px; color:var(--muted); margin-top:22px; }
  .err { color:#e0556b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂️ PERMAI TASK LIST</h1>
    <div class="sub">Drag a card between people · due dates, priority &amp; repeats · syncs live</div>
  </header>
  <div class="board" id="board"></div>
</div>

<div class="activity">
  <div class="act-head open" id="act-head"><span class="caret">▶</span><span>📋 Recent activity</span></div>
  <div class="act-body" id="act-body"></div>
</div>

<div id="status" class="status">Connecting…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, updateDoc, doc,
  onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzhvgI9ygGqmyeP-5jPaIMn44PO0Wb3Ak",
  authDomain: "permai-family.firebaseapp.com",
  projectId: "permai-family",
  storageBucket: "permai-family.firebasestorage.app",
  messagingSenderId: "1050539460224",
  appId: "1:1050539460224:web:0357111582c97d31b98865"
};

const PEOPLE = [
  { id:"NICK", name:"Nick", c:"#3b82f6", cs:"rgba(59,130,246,.35)",  csoft:"#e8f0fe" },
  { id:"IVY",  name:"Ivy",  c:"#10b981", cs:"rgba(16,185,129,.35)",  csoft:"#e3f7ef" },
  { id:"FYB",  name:"FYB",  c:"#8b5cf6", cs:"rgba(139,92,246,.35)",  csoft:"#efe9fd" }
];
const PRIO = { high:0, med:1, low:2 };
const nameOf = (id) => (PEOPLE.find(p => p.id === id) || {}).name || id;

const statusEl = document.getElementById("status");
const boardEl  = document.getElementById("board");

let db;
try { db = getFirestore(initializeApp(firebaseConfig)); }
catch (e) { statusEl.innerHTML = '<span class="err">Firebase init failed.</span>'; }
const tasksCol = () => collection(db, "tasks");
const actCol   = () => collection(db, "activity");

// ---- celebration: confetti + soft chime ----
let actx;
function chime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(actx.destination);
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
      o.start(t); o.stop(t + 0.32);
    });
  } catch (e) {}
}
function celebrate() {
  if (window.confetti) confetti({ particleCount: 70, spread: 62, startVelocity: 38, origin: { y: 0.75 } });
  chime();
}

// ---- activity log ----
function addActivity(action, text, person) {
  addDoc(actCol(), { action, text, person, ts: serverTimestamp() }).catch(() => {});
}

// per-column UI state (not persisted)
const drawerOpen = { NICK:false, IVY:false, FYB:false };
const editing = new Set();
const sortables = {};
let lastItems = [];

const activeEls = {}, drawerHeadEls = {}, drawerBodyEls = {}, countEls = {}, overEls = {};
for (const p of PEOPLE) {
  const col = document.createElement("div");
  col.className = "col";
  col.style.setProperty("--c", p.c);
  col.style.setProperty("--cs", p.cs);
  col.style.setProperty("--csoft", p.csoft);
  col.innerHTML = `
    <div class="col-head">
      <div class="avatar">${p.name.charAt(0)}</div>
      <div class="col-name">${p.name}</div>
      <div class="count" id="count-${p.id}">0</div>
      <div class="over-pill" id="over-${p.id}" style="display:none"></div>
    </div>
    <div class="add">
      <input type="text" placeholder="Add task for ${p.name}…" autocomplete="off" id="in-${p.id}" />
      <button id="btn-${p.id}">+</button>
    </div>
    <div class="tasks" id="list-${p.id}" data-owner="${p.id}"></div>
    <div class="drawer">
      <div class="drawer-head" id="dh-${p.id}"><span class="caret">▶</span><span id="dl-${p.id}">Done</span></div>
      <div class="drawer-body hide" id="db-${p.id}"></div>
    </div>`;
  boardEl.appendChild(col);

  activeEls[p.id]     = col.querySelector(`#list-${p.id}`);
  drawerHeadEls[p.id] = col.querySelector(`#dh-${p.id}`);
  drawerBodyEls[p.id] = col.querySelector(`#db-${p.id}`);
  countEls[p.id]      = col.querySelector(`#count-${p.id}`);
  overEls[p.id]       = col.querySelector(`#over-${p.id}`);

  const input = col.querySelector(`#in-${p.id}`);
  const addFn = async () => {
    const text = input.value.trim();
    if (!text || !db) return;
    input.value = "";
    try {
      await addDoc(tasksCol(), { text, done:false, by:p.id, priority:"med", due:null, repeat:null, created:serverTimestamp() });
      addActivity("add", text, p.id);
    } catch (e) { statusEl.innerHTML = '<span class="err">Could not save — check Firestore rules.</span>'; }
  };
  col.querySelector(`#btn-${p.id}`).onclick = addFn;
  input.addEventListener("keydown", e => { if (e.key === "Enter") addFn(); });

  drawerHeadEls[p.id].onclick = () => { drawerOpen[p.id] = !drawerOpen[p.id]; renderBoard(lastItems); };

  sortables[p.id] = new Sortable(activeEls[p.id], {
    group: "tasks", animation: 150, draggable: ".task",
    filter: ".check,.icbtn,.editor,.editor *,.due,input,button",
    preventOnFilter: false,
    onAdd: (evt) => {
      const id = evt.item.dataset.id;
      const owner = evt.to.dataset.owner;
      if (id && owner) {
        updateDoc(doc(db, "tasks", id), { by: owner });
        const it = lastItems.find(x => x.id === id);
        if (it) addActivity("move", it.t.text, owner);
      }
    }
  });
}

document.getElementById("act-head").onclick = (e) => {
  const h = e.currentTarget, b = document.getElementById("act-body");
  const open = !h.classList.contains("open");
  h.classList.toggle("open", open);
  b.classList.toggle("hide", !open);
};

// ---- task ops ----
const remove   = (id) => deleteDoc(doc(db,"tasks",id));
const setDue   = (id, v) => updateDoc(doc(db,"tasks",id), { due: v || null });
const setPrio  = (id, p) => updateDoc(doc(db,"tasks",id), { priority: p });
const setRepeat= (id, r) => updateDoc(doc(db,"tasks",id), { repeat: r === "none" ? null : r });
const uncomplete = (id) => updateDoc(doc(db,"tasks",id), { done:false });

function nextDue(due, repeat) {
  let base = due ? new Date(due + "T00:00:00") : new Date(new Date().setHours(0,0,0,0));
  const today = new Date(new Date().setHours(0,0,0,0));
  if (base < today) base = today;
  base.setDate(base.getDate() + (repeat === "weekly" ? 7 : 1));
  const y = base.getFullYear(), m = String(base.getMonth()+1).padStart(2,"0"), d = String(base.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

async function completeTask(id, t) {
  celebrate();
  addActivity("done", t.text, t.by);
  if (t.repeat === "daily" || t.repeat === "weekly") {
    await addDoc(tasksCol(), {
      text:t.text, done:false, by:t.by, priority:t.priority || "med",
      due: nextDue(t.due, t.repeat), repeat:t.repeat, created:serverTimestamp()
    });
  }
  await updateDoc(doc(db,"tasks",id), { done:true });
}

function dueInfo(due) {
  if (!due) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(due + "T00:00:00");
  const diff = Math.round((d - t) / 86400000);
  const dstr = d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
  if (diff < 0)  return { cls:"over",  label:"Overdue · " + dstr };
  if (diff === 0) return { cls:"today", label:"Today" };
  if (diff === 1) return { cls:"today", label:"Tomorrow" };
  if (diff <= 3)  return { cls:"soon",  label:dstr };
  return { cls:"later", label:dstr };
}

function sortKey(a, b) {
  const pa = PRIO[a.t.priority] ?? 1, pb = PRIO[b.t.priority] ?? 1;
  if (pa !== pb) return pa - pb;
  const da = a.t.due ? new Date(a.t.due).getTime() : Infinity;
  const dbb = b.t.due ? new Date(b.t.due).getTime() : Infinity;
  if (da !== dbb) return da - dbb;
  return (a.t.created?.seconds || 0) - (b.t.created?.seconds || 0);
}

function activeNode(id, t) {
  const row = document.createElement("div");
  row.className = "task";
  row.dataset.id = id;
  const di = dueInfo(t.due);
  const pr = t.priority || "med";
  const rep = t.repeat || "none";
  const isEd = editing.has(id);
  row.innerHTML = `
    <div class="task-main">
      <span class="pdot ${pr}" title="${pr} priority"></span>
      <div class="check"></div>
      <div class="txt"></div>
      <button class="icbtn edit ${isEd ? "editing" : ""}" title="${isEd ? "Done editing" : "Edit"}">${isEd ? "✓" : "✎"}</button>
      <button class="icbtn del" title="Delete">&times;</button>
    </div>
    <div class="badges">
      ${di ? `<span class="due ${di.cls}">${di.label}</span>` : ""}
      ${t.repeat ? `<span class="due rep-badge">🔁 ${t.repeat}</span>` : ""}
    </div>
    <div class="editor ${isEd ? "" : "hide"}">
      <div class="erow">
        <label>Due</label>
        <input type="date" value="${t.due || ""}" />
        <button class="clr">clear</button>
      </div>
      <div class="erow" style="margin-top:8px">
        <label>Priority</label>
        <div class="pri">
          <button data-p="high" class="${pr==="high"?"sel-high":""}">High</button>
          <button data-p="med"  class="${pr==="med" ?"sel-med" :""}">Med</button>
          <button data-p="low"  class="${pr==="low" ?"sel-low" :""}">Low</button>
        </div>
      </div>
      <div class="erow" style="margin-top:8px">
        <label>Repeat</label>
        <div class="pri rep">
          <button data-r="none"   class="${rep==="none"  ?"sel-rep":""}">None</button>
          <button data-r="daily"  class="${rep==="daily" ?"sel-rep":""}">Daily</button>
          <button data-r="weekly" class="${rep==="weekly"?"sel-rep":""}">Weekly</button>
        </div>
      </div>
    </div>`;
  row.querySelector(".txt").textContent = t.text;
  row.querySelector(".check").onclick = () => completeTask(id, t);
  row.querySelector(".del").onclick = () => remove(id);
  row.querySelector(".edit").onclick = () => {
    if (editing.has(id)) editing.delete(id); else editing.add(id);
    renderBoard(lastItems);
  };
  row.querySelector('input[type=date]').onchange = (e) => setDue(id, e.target.value);
  row.querySelector(".clr").onclick = () => setDue(id, "");
  row.querySelectorAll(".pri:not(.rep) button").forEach(b => b.onclick = () => setPrio(id, b.dataset.p));
  row.querySelectorAll(".rep button").forEach(b => b.onclick = () => setRepeat(id, b.dataset.r));
  return row;
}

function doneNode(id, t) {
  const row = document.createElement("div");
  row.className = "task done";
  row.innerHTML = `
    <div class="task-main">
      <div class="check on"></div>
      <div class="txt"></div>
      <button class="icbtn del" title="Delete">&times;</button>
    </div>`;
  row.querySelector(".txt").textContent = t.text;
  row.querySelector(".check").onclick = () => uncomplete(id);
  row.querySelector(".del").onclick = () => remove(id);
  return row;
}

function renderBoard(items) {
  const active = {}, done = {};
  PEOPLE.forEach(p => { active[p.id] = []; done[p.id] = []; });
  items.forEach(({ id, t }) => {
    if (!active[t.by]) return;
    (t.done ? done[t.by] : active[t.by]).push({ id, t });
  });

  for (const p of PEOPLE) {
    const a = active[p.id].sort(sortKey);
    const d = done[p.id].sort((x,y) => (y.t.created?.seconds||0)-(x.t.created?.seconds||0));

    const el = activeEls[p.id];
    el.innerHTML = "";
    if (!a.length) el.innerHTML = '<div class="col-empty">No tasks — drag one here or add above</div>';
    else a.forEach(({ id, t }) => el.appendChild(activeNode(id, t)));

    countEls[p.id].textContent = a.length;
    const overdue = a.filter(x => { const di = dueInfo(x.t.due); return di && di.cls === "over"; }).length;
    overEls[p.id].style.display = overdue ? "inline-block" : "none";
    overEls[p.id].textContent = overdue ? overdue + " overdue" : "";

    drawerHeadEls[p.id].querySelector(`#dl-${p.id}`).textContent = "Done (" + d.length + ")";
    drawerHeadEls[p.id].classList.toggle("open", drawerOpen[p.id]);
    const body = drawerBodyEls[p.id];
    body.classList.toggle("hide", !drawerOpen[p.id]);
    body.innerHTML = "";
    if (drawerOpen[p.id]) {
      if (!d.length) body.innerHTML = '<div class="col-empty">Nothing done yet</div>';
      else d.forEach(({ id, t }) => body.appendChild(doneNode(id, t)));
    }
  }
}

function relTime(sec) {
  if (!sec) return "just now";
  const diff = Math.floor(Date.now()/1000 - sec);
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
const ACT = {
  add:  { ico:"➕", verb:"added",     prep:"for" },
  done: { ico:"✅", verb:"completed", prep:"·"   },
  move: { ico:"↔️", verb:"moved",     prep:"to"  }
};
function renderActivity(rows) {
  const body = document.getElementById("act-body");
  if (!rows.length) { body.innerHTML = '<div class="act-empty">No activity yet.</div>'; return; }
  body.innerHTML = "";
  rows.forEach(a => {
    const meta = ACT[a.action] || { ico:"•", verb:a.action, prep:"" };
    const item = document.createElement("div");
    item.className = "act-item";
    const txt = document.createElement("div");
    txt.className = "act-txt";
    txt.innerHTML = `${meta.verb} <b></b> ${meta.prep} ${nameOf(a.person)}`;
    txt.querySelector("b").textContent = '"' + a.text + '"';
    item.innerHTML = `<span class="act-ico">${meta.ico}</span>`;
    item.appendChild(txt);
    const time = document.createElement("span");
    time.className = "act-time";
    time.textContent = relTime(a.ts?.seconds);
    item.appendChild(time);
    body.appendChild(item);
  });
}

if (db) {
  onSnapshot(query(tasksCol(), orderBy("created","asc")), snap => {
    lastItems = [];
    snap.forEach(dd => lastItems.push({ id: dd.id, t: dd.data() }));
    renderBoard(lastItems);
    const n = snap.size;
    statusEl.textContent = "Live · " + n + " task" + (n === 1 ? "" : "s") + " total";
  }, err => { statusEl.innerHTML = '<span class="err">Connection error: ' + err.code + '</span>'; });

  onSnapshot(query(actCol(), orderBy("ts","desc"), limit(25)), snap => {
    const rows = []; snap.forEach(d => rows.push(d.data()));
    renderActivity(rows);
  }, () => {});
}
</script>
</body>
</html>
