<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared Task List</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #8a97a6;
    --line: #e4e9ee;
    --accent: #0a7c6e;
    --accent-soft: #e6f4f1;
    --danger: #d65151;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .who {
    display: flex; gap: 8px; align-items: center;
    margin: 16px 0;
  }
  .who label { font-size: 13px; color: var(--muted); }
  .who select {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 14px; background: var(--card);
    color: var(--ink); cursor: pointer;
  }

  .add {
    display: flex; gap: 8px; margin-bottom: 18px;
  }
  .add input {
    flex: 1; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; background: var(--card);
    color: var(--ink); outline: none;
  }
  .add input:focus { border-color: var(--accent); }
  .add button {
    border: none; background: var(--accent); color: #fff;
    border-radius: 10px; padding: 0 18px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .add button:active { transform: scale(0.97); }

  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  }
  li.done { opacity: 0.55; }
  .check {
    width: 22px; height: 22px; flex: none;
    border: 2px solid var(--line); border-radius: 50%;
    cursor: pointer; display: grid; place-items: center;
    transition: all 0.12s;
  }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check.on::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
  .body { flex: 1; min-width: 0; }
  .txt { font-size: 15px; word-break: break-word; }
  li.done .txt { text-decoration: line-through; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .del {
    border: none; background: none; color: var(--muted);
    font-size: 18px; cursor: pointer; flex: none; padding: 4px;
  }
  .del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .status { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 Shared Task List</h1>
    <div class="sub">Everyone with this link sees the same list, live.</div>
  </header>

  <div class="who">
    <label>I am:</label>
    <select id="me">
      <option>Doctor</option>
      <option>Wife</option>
      <option>Me</option>
    </select>
  </div>

  <div class="add">
    <input id="newTask" type="text" placeholder="Add a task and press Enter…" autocomplete="off" />
    <button id="addBtn">Add</button>
  </div>

  <ul id="list"></ul>
  <div id="empty" class="empty" style="display:none">No tasks yet. Add one above.</div>

  <div id="status" class="status">Connecting…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, updateDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===========================================================================
//  STEP 1 — paste your Firebase config here (see setup steps I gave you).
//  Replace every "REPLACE_ME" value with the one from your Firebase project.
// ===========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBzhvgI9ygGqmyeP-5jPaIMn44PO0Wb3Ak",
  authDomain: "permai-family.firebaseapp.com",
  projectId: "permai-family",
  storageBucket: "permai-family.firebasestorage.app",
  messagingSenderId: "1050539460224",
  appId: "1:1050539460224:web:0357111582c97d31b98865"
};
// ===========================================================================

const statusEl = document.getElementById("status");
let db;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} catch (e) {
  statusEl.innerHTML = '<span class="err">Firebase not set up yet — paste your config in the file.</span>';
}

const listEl  = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const input   = document.getElementById("newTask");
const meSel   = document.getElementById("me");

// remember who I am between visits
meSel.value = localStorage.getItem("me") || "Me";
meSel.addEventListener("change", () => localStorage.setItem("me", meSel.value));

const tasksCol = () => collection(db, "tasks");

async function addTask() {
  const text = input.value.trim();
  if (!text || !db) return;
  input.value = "";
  try {
    await addDoc(tasksCol(), {
      text,
      done: false,
      by: meSel.value,
      created: serverTimestamp()
    });
  } catch (e) {
    statusEl.innerHTML = '<span class="err">Could not save — check Firestore rules.</span>';
  }
}

async function toggle(id, done) {
  await updateDoc(doc(db, "tasks", id), { done: !done });
}
async function remove(id) {
  await deleteDoc(doc(db, "tasks", id));
}

document.getElementById("addBtn").addEventListener("click", addTask);
input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

if (db) {
  const q = query(tasksCol(), orderBy("created", "asc"));
  onSnapshot(q, snap => {
    listEl.innerHTML = "";
    if (snap.empty) { emptyEl.style.display = "block"; }
    else { emptyEl.style.display = "none"; }
    statusEl.textContent = "Live · " + snap.size + " task" + (snap.size === 1 ? "" : "s");

    snap.forEach(d => {
      const t = d.data();
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");

      const chk = document.createElement("div");
      chk.className = "check" + (t.done ? " on" : "");
      chk.onclick = () => toggle(d.id, t.done);

      const body = document.createElement("div");
      body.className = "body";
      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = t.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "added by " + (t.by || "?");
      body.appendChild(txt);
      body.appendChild(meta);

      const del = document.createElement("button");
      del.className = "del";
      del.innerHTML = "&times;";
      del.title = "Delete";
      del.onclick = () => remove(d.id);

      li.appendChild(chk);
      li.appendChild(body);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }, err => {
    statusEl.innerHTML = '<span class="err">Connection error: ' + err.code + '</span>';
  });
}
</script>
</body>
</html>
