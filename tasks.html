<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Task Board</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --ink: #1d2733;
    --muted: #93a1b0;
    --line: #e6ebf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #eef1f5 0%, #e4e9f0 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 5px; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 760px) {
    .board { grid-template-columns: 1fr; }
  }

  .col {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(40,60,90,0.07);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-top: 5px solid var(--c);
  }
  .col-head {
    display: flex; align-items: center; gap: 11px;
    padding: 16px 18px 14px;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 15px;
    background: var(--c);
    box-shadow: 0 3px 10px var(--cs);
    flex: none;
  }
  .col-name { font-size: 16px; font-weight: 700; flex: 1; }
  .count {
    font-size: 12px; font-weight: 700; color: var(--c);
    background: var(--csoft); border-radius: 20px;
    padding: 3px 10px;
  }

  .add {
    display: flex; gap: 8px; padding: 0 14px 14px;
  }
  .add input {
    flex: 1; border: 1.5px solid var(--line); border-radius: 11px;
    padding: 11px 13px; font-size: 14px; background: #fafbfc;
    color: var(--ink); outline: none; transition: border-color .15s;
    min-width: 0;
  }
  .add input:focus { border-color: var(--c); background: #fff; }
  .add button {
    border: none; background: var(--c); color: #fff;
    border-radius: 11px; padding: 0 15px; font-size: 20px;
    font-weight: 600; cursor: pointer; line-height: 1; flex: none;
    transition: transform .1s, filter .15s;
  }
  .add button:hover { filter: brightness(1.05); }
  .add button:active { transform: scale(0.92); }

  .tasks { padding: 0 14px 16px; flex: 1; min-height: 60px; }

  .task {
    display: flex; align-items: flex-start; gap: 11px;
    background: #fafbfc; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 13px; margin-bottom: 9px;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .task.done { opacity: 0.5; }

  .check {
    width: 21px; height: 21px; flex: none; margin-top: 1px;
    border: 2px solid #cdd6df; border-radius: 7px;
    cursor: pointer; display: grid; place-items: center;
    transition: all .12s;
  }
  .check.on { background: var(--c); border-color: var(--c); }
  .check.on::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 800; }

  .txt { flex: 1; font-size: 14.5px; line-height: 1.35; word-break: break-word; padding-top: 1px; }
  .task.done .txt { text-decoration: line-through; }

  .del {
    border: none; background: none; color: #c4cdd6;
    font-size: 17px; cursor: pointer; flex: none; padding: 0 2px;
    line-height: 1; transition: color .15s;
  }
  .del:hover { color: #e0556b; }

  .col-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 22px 0; }

  .status { text-align: center; font-size: 12px; color: var(--muted); margin-top: 26px; }
  .err { color: #e0556b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂️ Family Task Board</h1>
    <div class="sub">Live for everyone with the link · changes sync instantly</div>
  </header>

  <div class="board" id="board"></div>

  <div id="status" class="status">Connecting…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, updateDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzhvgI9ygGqmyeP-5jPaIMn44PO0Wb3Ak",
  authDomain: "permai-family.firebaseapp.com",
  projectId: "permai-family",
  storageBucket: "permai-family.firebasestorage.app",
  messagingSenderId: "1050539460224",
  appId: "1:1050539460224:web:0357111582c97d31b98865"
};

// People = columns. id is what we store in the doc's `by` field.
const PEOPLE = [
  { id: "NICK", name: "Nick", c: "#3b82f6", cs: "rgba(59,130,246,.35)",  csoft: "#e8f0fe" },
  { id: "IVY",  name: "Ivy",  c: "#10b981", cs: "rgba(16,185,129,.35)",  csoft: "#e3f7ef" },
  { id: "FYB",  name: "FYB",  c: "#8b5cf6", cs: "rgba(139,92,246,.35)",  csoft: "#efe9fd" }
];

const statusEl = document.getElementById("status");
const boardEl  = document.getElementById("board");

let db;
try {
  db = getFirestore(initializeApp(firebaseConfig));
} catch (e) {
  statusEl.innerHTML = '<span class="err">Firebase init failed.</span>';
}

const tasksCol = () => collection(db, "tasks");

// Build the 3 columns once. Each keeps its own input + task list element.
const listEls = {};
for (const p of PEOPLE) {
  const col = document.createElement("div");
  col.className = "col";
  col.style.setProperty("--c", p.c);
  col.style.setProperty("--cs", p.cs);
  col.style.setProperty("--csoft", p.csoft);

  col.innerHTML = `
    <div class="col-head">
      <div class="avatar">${p.name.charAt(0)}</div>
      <div class="col-name">${p.name}</div>
      <div class="count" id="count-${p.id}">0</div>
    </div>
    <div class="add">
      <input type="text" placeholder="Add task for ${p.name}…" autocomplete="off" id="in-${p.id}" />
      <button id="btn-${p.id}">+</button>
    </div>
    <div class="tasks" id="list-${p.id}"></div>
  `;
  boardEl.appendChild(col);
  listEls[p.id] = col.querySelector(`#list-${p.id}`);

  const input = col.querySelector(`#in-${p.id}`);
  const addFn = async () => {
    const text = input.value.trim();
    if (!text || !db) return;
    input.value = "";
    try {
      await addDoc(tasksCol(), { text, done: false, by: p.id, created: serverTimestamp() });
    } catch (e) {
      statusEl.innerHTML = '<span class="err">Could not save — check Firestore rules.</span>';
    }
  };
  col.querySelector(`#btn-${p.id}`).onclick = addFn;
  input.addEventListener("keydown", e => { if (e.key === "Enter") addFn(); });
}

const toggle = (id, done) => updateDoc(doc(db, "tasks", id), { done: !done });
const remove = (id) => deleteDoc(doc(db, "tasks", id));

function taskNode(id, t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " done" : "");

  const chk = document.createElement("div");
  chk.className = "check" + (t.done ? " on" : "");
  chk.onclick = () => toggle(id, t.done);

  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = t.text;

  const del = document.createElement("button");
  del.className = "del";
  del.innerHTML = "&times;";
  del.title = "Delete";
  del.onclick = () => remove(id);

  row.append(chk, txt, del);
  return row;
}

if (db) {
  const q = query(tasksCol(), orderBy("created", "asc"));
  onSnapshot(q, snap => {
    // bucket tasks by person
    const buckets = {}; PEOPLE.forEach(p => buckets[p.id] = []);
    snap.forEach(d => {
      const t = d.data();
      if (buckets[t.by]) buckets[t.by].push({ id: d.id, t });
    });

    for (const p of PEOPLE) {
      const el = listEls[p.id];
      el.innerHTML = "";
      const items = buckets[p.id];
      document.getElementById(`count-${p.id}`).textContent = items.length;
      if (!items.length) {
        el.innerHTML = '<div class="col-empty">No tasks yet</div>';
      } else {
        items.forEach(({ id, t }) => el.appendChild(taskNode(id, t)));
      }
    }
    statusEl.textContent = "Live · " + snap.size + " task" + (snap.size === 1 ? "" : "s") + " total";
  }, err => {
    statusEl.innerHTML = '<span class="err">Connection error: ' + err.code + '</span>';
  });
}
</script>
</body>
</html>
